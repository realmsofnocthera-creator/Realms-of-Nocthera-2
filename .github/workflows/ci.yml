# 0.5-D4 — Regra fixa do roadmap (build e testes limpos) verificada em cada push e PR.
# As ações vêm fixadas pelo SHA do commit (o comentário diz a versão): uma tag como @v4 pode ser movida por quem controla a ação. O Dependabot
# (github-actions) abre o PR para atualizar o SHA e o comentário juntos.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # 6.5-14: falha a partir de severidade moderada nas dependências de produção
      - name: Auditoria de segurança (dependências de produção, moderada ou mais)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit -p .

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # 6.5-14: falha se um commit novo trouxer uma chave ou senha (regras padrão do gitleaks; exceções em .gitleaks.toml)
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
