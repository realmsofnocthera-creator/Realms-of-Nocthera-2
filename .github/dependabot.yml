# 6.5-14: atualização automática das dependências. O Dependabot só abre PRs; nada entra sem o merge do Yuri.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # as atualizações pequenas vêm juntas num PR só, para não lotar a lista
      pequenas:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
